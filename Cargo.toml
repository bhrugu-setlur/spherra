[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
  "crates/spherra-domain",
  "crates/spherra-simd",
  "crates/spherra-codec",
  "crates/spherra-format",
  "crates/spherra-testkit",
  "crates/spherra-bench",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
blake3 = "1"
crc32c = "0.6"
half = "2"
proptest = "1"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
tempfile = "3"
thiserror = "2"
zerocopy = { version = "0.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "allow"
