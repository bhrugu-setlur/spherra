name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    name: Local quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Cargo tools
        run: |
          cargo install cargo-nextest --version 0.9.114 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Run local quality gate
        run: bash scripts/ci.sh

  security:
    name: Security advisories (timestamped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories and record database timestamp
        run: |
          printf 'cargo-deny advisory database checked at %s\\n' "$(date --utc --iso-8601=seconds)"
          cargo deny check advisories
