name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    name: Local quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Cargo tools
        run: |
          cargo install cargo-nextest --version 0.9.114 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Run local quality gate
        run: bash scripts/ci.sh

  security:
    name: Security advisories (timestamped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories and record database revision
        run: |
          set -euo pipefail
          cargo deny fetch db
          advisory_root="${CARGO_HOME:-$HOME/.cargo}/advisory-dbs"
          advisory_count=0
          while IFS= read -r -d '' advisory_database; do
            git -C "$advisory_database" rev-parse --is-inside-work-tree >/dev/null
            printf 'cargo-deny advisory database: %s\n' "$advisory_database"
            printf 'cargo-deny advisory database HEAD: %s\n' "$(git -C "$advisory_database" rev-parse HEAD)"
            printf 'cargo-deny advisory database commit timestamp: %s\n' "$(git -C "$advisory_database" show -s --format=%cI HEAD)"
            advisory_count=$((advisory_count + 1))
          done < <(find "$advisory_root" -mindepth 1 -maxdepth 1 -type d -print0)
          test "$advisory_count" -gt 0
          cargo deny check advisories
