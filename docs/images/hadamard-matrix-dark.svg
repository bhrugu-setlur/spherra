<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><title>Sylvester construction of Hadamard matrices</title><rect width="100%" height="100%" rx="12" fill="#1a1a19"/><text x="24.0" y="34.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Hadamard matrices: Sylvester’s construction</text><text x="24.0" y="56.0" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Starts from H₁ = [+1] and doubles size: H₂ₙ combines two copies of Hₙ and flips the lower-right sign.</text><text x="40.0" y="92.0" font-size="13" font-weight="600" fill="#c3c2b7" text-anchor="start">Recursive rule</text><text x="40.0" y="166.0" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start">H₂ₙ  =</text><path d="M101.0,113.0 H94.0 V207.0 H101.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M217.0,113.0 H224.0 V207.0 H217.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="102" y="119" width="54" height="38" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="1.8"/><text x="129.0" y="143.0" font-size="15" font-weight="600" fill="#3987e5" text-anchor="middle">Hₙ</text><rect x="162" y="119" width="54" height="38" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="1.8"/><text x="189.0" y="143.0" font-size="15" font-weight="600" fill="#3987e5" text-anchor="middle">Hₙ</text><rect x="102" y="163" width="54" height="38" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="1.8"/><text x="129.0" y="187.0" font-size="15" font-weight="600" fill="#3987e5" text-anchor="middle">Hₙ</text><rect x="162" y="163" width="54" height="38" rx="6" fill="#1a1a19" stroke="#d95926" stroke-width="1.8"/><text x="189.0" y="187.0" font-size="15" font-weight="600" fill="#d95926" text-anchor="middle">−Hₙ</text><text x="300.0" y="92.0" font-size="13" font-weight="600" fill="#c3c2b7" text-anchor="start">H₁ (1×1)</text><text x="300.0" y="166.0" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start">H₁  =</text><path d="M349.0,136.0 H342.0 V184.0 H349.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M387.0,136.0 H394.0 V184.0 H387.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="350" y="142" width="36" height="36" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="1.8"/><text x="368.0" y="165.0" font-size="13" font-weight="600" fill="#3987e5" text-anchor="middle">+1</text><text x="445.0" y="92.0" font-size="13" font-weight="600" fill="#c3c2b7" text-anchor="start">H₂ (2×2)</text><text x="445.0" y="166.0" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start">H₂  =</text><path d="M494.0,118.0 H487.0 V202.0 H494.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M568.0,118.0 H575.0 V202.0 H568.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="495" y="124" width="34" height="34" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="512.0" y="146.0" font-size="13" font-weight="600" fill="#3987e5" text-anchor="middle">+1</text><rect x="533" y="124" width="34" height="34" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="550.0" y="146.0" font-size="13" font-weight="600" fill="#3987e5" text-anchor="middle">+1</text><rect x="495" y="162" width="34" height="34" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="512.0" y="184.0" font-size="13" font-weight="600" fill="#3987e5" text-anchor="middle">+1</text><rect x="533" y="162" width="34" height="34" rx="6" fill="#1a1a19" stroke="#d95926" stroke-width="1.6"/><text x="550.0" y="184.0" font-size="13" font-weight="600" fill="#d95926" text-anchor="middle">−1</t