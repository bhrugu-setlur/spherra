<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><title>Sylvester construction of Hadamard matrices</title><rect width="100%" height="100%" rx="12" fill="#1a1a19"/><text x="24.0" y="34.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Hadamard matrices: Sylvester’s construction</text><text x="24.0" y="56.0" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Starts from H₁ = [+1] and doubles size: H₂ₙ combines two copies of Hₙ and flips the lower-right sign.</text><text x="45.0" y="86.0" font-size="13" font-weight="600" fill="#c3c2b7" text-anchor="start">Sylvester’s rule</text><text x="45.0" y="186.0" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start">H₂ₙ =</text><path d="M105.0,133.0 H99.0 V227.0 H105.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M215.0,133.0 H221.0 V227.0 H215.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="107" y="139" width="50" height="38" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="1.8"/><text x="132.0" y="163.0" font-size="15" font-weight="600" fill="#3987e5" text-anchor="middle">Hₙ</text><rect x="163" y="139" width="50" height="38" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="1.8"/><text x="188.0" y="163.0" font-size="15" font-weight="600" fill="#3987e5" text-anchor="middle">Hₙ</text><rect x="107" y="183" width="50" height="38" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="1.8"/><text x="132.0" y="207.0" font-size="15" font-weight="600" fill="#3987e5" text-anchor="middle">Hₙ</text><rect x="163" y="183" width="50" height="38" rx="6" fill="#1a1a19" stroke="#d95926" stroke-width="1.8"/><text x="188.0" y="207.0" font-size="15" font-weight="600" fill="#d95926" text-anchor="middle">−Hₙ</text><text x="300.0" y="86.0" font-size="13" font-weight="600" fill="#c3c2b7" text-anchor="start">H₁ (1×1)</text><text x="300.0" y="186.0" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start">H₁ =</text><path d="M350.0,156.0 H344.0 V204.0 H350.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M390.0,156.0 H396.0 V204.0 H390.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="352" y="162" width="36" height="36" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="1.8"/><text x="370.0" y="185.0" font-size="13" font-weight="600" fill="#3987e5" text-anchor="middle">+1</text><text x="460.0" y="86.0" font-size="13" font-weight="600" fill="#c3c2b7" text-anchor="start">H₂ (2×2)</text><text x="460.0" y="186.0" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start">H₂ =</text><path d="M510.0,138.0 H504.0 V222.0 H510.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M586.0,138.0 H592.0 V222.0 H586.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="512" y="144" width="34" height="34" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="529.0" y="166.0" font-size="13" font-weight="600" fill="#3987e5" text-anchor="middle">+1</text><rect x="550" y="144" width="34" height="34" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="567.0" y="166.0" font-size="13" font-weight="600" fill="#3987e5" text-anchor="middle">+1</text><rect x="512" y="182" width="34" height="34" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="529.0" y="204.0" font-size="13" font-weight="600" fill="#3987e5" text-anchor="middle">+1</text><rect x="550" y="182" width="34" height="34" rx="6" fill="#1a1a19" stroke="#d95926" stroke-width="1.6"/><text x="567.0" y="204.0" font-size="13" font-weight="600" fill="#d95926" text-anchor="middle">−1</text><text x="665.0" y="86.0" font-size="13" font-weight="600" fill="#c3c2b7" text-anchor="start">H₄ (4×4)</text><text x="665.0" y="186.0" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start">H₄ =</text><path d="M719.0,108.0 H713.0 V252.0 H719.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M855.0,108.0 H861.0 V252.0 H855.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="787.0" y1="114.0" x2="787.0" y2="246.0" stroke="#3d3d3a" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="2 2"/><line x1="721.0" y1="180.0" x2="853.0" y2="180.0" stroke="#3d3d3a" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="2 2"/><rect x="721" y="114" width="30" height="30" rx="5" fill="#1a1a19" stroke="#3987e5" stroke-width="1.4"/><text x="736.0" y="134.0" font-size="12" font-weight="600" fill="#3987e5" text-anchor="middle">+1</text><rect x="755" y="114" width="30" height="30" rx="5" fill="#1a1a19" stroke="#3987e5" stroke-width="1.4"/><text x="770.0" y="134.0" font-size="12" font-weight="600" fill="#3987e5" text-anchor="middle">+1</text><rect x="789" y="114" width="30" height="30" rx="5" fill="#1a1a19" stroke="#3987e5" stroke-width="1.4"/><text x="804.0" y="134.0" font-size="12" font-weight="600" fill="#3987e5" text-anchor="middle">+1</text><rect x="823" y="114" width="30" height="30" rx="5" fill="#1a1a19" stroke="#3987e5" stroke-width="1.4"/><text x="838.0" y="134.0" font-size="12" font-weight="600" fill="#3987e5" text-anchor="middle">+1</text><rect x="721" y="148" width="30" height="30" rx="5" fill="#1a1a19" stroke="#3987e5" stroke-width="1.4"/><text x="736.0" y="168.0" font-size="12" font-weight="600" fill="#3987e5" text-anchor="middle">+1</text><rect x="755" y="148" width="30" height="30" rx="5" fill="#1a1a19" stroke="#d95926" stroke-width="1.4"/><text x="770.0" y="168.0" font-size="12" font-weight="600" fill="#d95926" text-anchor="middle"