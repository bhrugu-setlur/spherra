<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><title>Sylvester construction of Hadamard matrices</title><rect width="100%" height="100%" rx="12" fill="#fcfcfb"/><text x="24.0" y="34.0" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">Hadamard matrices: Sylvester’s construction</text><text x="24.0" y="56.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Starts from H₁ = [+1] and doubles size: H₂ₙ combines two copies of Hₙ and flips the lower-right sign.</text><text x="45.0" y="186.0" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">H₂ₙ =</text><text x="160.0" y="76.0" font-size="13" font-weight="600" fill="#52514e" text-anchor="middle">Sylvester’s rule</text><path d="M105.0,133.0 H99.0 V227.0 H105.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M215.0,133.0 H221.0 V227.0 H215.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="107" y="139" width="50" height="38" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.8"/><text x="132.0" y="163.0" font-size="15" font-weight="600" fill="#2a78d6" text-anchor="middle">Hₙ</text><rect x="163" y="139" width="50" height="38" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.8"/><text x="188.0" y="163.0" font-size="15" font-weight="600" fill="#2a78d6" text-anchor="middle">Hₙ</text><rect x="107" y="183" width="50" height="38" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.8"/><text x="132.0" y="207.0" font-size="15" font-weight="600" fill="#2a78d6" text-anchor="middle">Hₙ</text><rect x="163" y="183" width="50" height="38" rx="6" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.8"/><text x="188.0" y="207.0" font-size="15" font-weight="600" fill="#eb6834" text-anchor="middle">−Hₙ</text><text x="300.0" y="18