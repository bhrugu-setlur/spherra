<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><title>Scores estimated from the compressed vector</title><rect width="100%" height="100%" rx="12" fill="#fcfcfb"/><text x="24.0" y="36.0" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">Scoring the query against the stored vector</text><text x="24.0" y="58.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">q·y is the true cosine similarity. Spherra only has p and r, so it estimates it.</text><text x="244.0" y="104.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="end">True cosine</text><text x="244.0" y="121.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="end">q·y</text><rect x="260" y="90" width="360.0" height="26" rx="4" fill="#2a78d6" fill-opacity="1.0"/><text x="630.0" y="108.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">0.800</text><text x="244.0" y="152.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="end">Quick score</text><text x="244.0" y="169.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="end">q·p</text><rect x="260" y="138" width="420.0" height="26" rx="4" fill="#eb6834" fill-opacity="1.0"/><text x="690.0" y="156.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">0.933</text><text x="244.0" y="200.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="end">With correction</text><text x="244.0" y="217.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="end">q·r</text><rect x="260" y="186" width="375.0" height="26" rx="4" fill="#1baf7a" fill-opacity="0.45"/><text x="645.0" y="204.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">0.833</text><text x="244.0" y="248.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="end">Length fixed</text><text x="244.0" y="265.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="end">q·r / ‖r‖</text><rect x="260" y="234" width="359.2" height="26" rx="4" fill="#1baf7a" fill-opacity="1.0"/><text x="630.0" y="252.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">0.798</text><line x1="620.0" y1="80.0" x2="620.0" y2="268.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/><text x="620.0" y="74.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">truth</text></svg>
