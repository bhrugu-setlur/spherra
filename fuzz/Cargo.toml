[workspace]

[package]
name = "spherra-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
spherra = { path = "../crates/spherra", features = ["fuzzing"] }
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
spherra-codec = { path = "../crates/spherra-codec", features = ["fuzzing"] }
spherra-domain = { path = "../crates/spherra-domain" }
spherra-format = { path = "../crates/spherra-format" }

[[bin]]
name = "format_open"
path = "fuzz_targets/format_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bound_soundness"
path = "fuzz_targets/bound_soundness.rs"
test = false
doc = false
bench = false

[[bin]]
name = "index_current"
path = "fuzz_targets/index_current.rs"
test = false
doc = false
bench = false

[[bin]]
name = "index_model"
path = "fuzz_targets/index_model.rs"
test = false
doc = false
bench = false

[[bin]]
name = "index_manifest"
path = "fuzz_targets/index_manifest.rs"
test = false
doc = false
bench = false
